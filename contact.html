<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Elhadj Diattara</title>
  <meta name="description" content="Contactez Elhadj Diattara, étudiant en Administration Systèmes, Réseaux et Cybersécurité, par email ou LinkedIn." />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- 
      EN-TÊTE : le bouton Menu est un élément <details> natif,
      identique sur ordinateur et sur mobile.
        -->
  <header class="header">
    <div class="container header__row">
      <details class="menu">
        <summary class="menu__button">
          <span class="menu__bars" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>Menu</span>
        </summary>
        <nav class="menu__panel" aria-label="Navigation principale">
          <a href="index.html">Accueil</a>
          <a href="about.html">À propos</a>
          <a href="skills.html">Compétences</a>
          <a href="certifications.html">Certifications</a>
          <a href="projects.html">Projets</a>
          <a href="parcours.html">Parcours</a>
          <a href="contact.html">Contact</a>
        </nav>
      </details>
    </div>
  </header>

  <main id="top">
    <section class="section">
      <div class="container">
        <h1 class="page-intro__title">Contact</h1>
        <p class="page-intro__lead">Une question ou une proposition d'alternance ? Écrivez-moi.</p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container contact-grid">

        <div class="contact-info">
          <div class="contact-info__row">
            <span class="contact-info__label">Email</span>
            <a class="contact-info__value" href="mailto:diattaraelhadj@gmail.com">diattaraelhadj@gmail.com</a>
          </div>
          <div class="contact-info__row">
            <span class="contact-info__label">LinkedIn</span>
            <a class="contact-info__value" href="https://www.linkedin.com/in/elhadj-diattara/" target="_blank" rel="noopener noreferrer">elhadj-diattara</a>
          </div>

          <a href="assets/cv/CV_Elhadj_Diattara.pdf" download class="btn btn--primary contact-info__cv">
            <svg class="icon"><use href="#icon-file-text"></use></svg>
            Voir / Télécharger mon CV
          </a>
        </div>

        <div class="contact-form-col">
          <form id="contact-form" novalidate>
            <div class="field-row">
              <div class="field">
                <label class="field__label" for="name">Nom</label>
                <input class="field__control" type="text" id="name" name="name" placeholder="Votre nom" />
                <span class="field__error"></span>
              </div>
              <div class="field">
                <label class="field__label" for="email">Email</label>
                <input class="field__control" type="email" id="email" name="email" placeholder="vous@exemple.com" />
                <span class="field__error"></span>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="subject">Sujet</label>
              <input class="field__control" type="text" id="subject" name="subject" placeholder="Objet de votre message" />
              <span class="field__error"></span>
            </div>

            <div class="field">
              <label class="field__label" for="message">Message</label>
              <textarea class="field__control" id="message" name="message" placeholder="Votre message..."></textarea>
              <span class="field__error"></span>
            </div>

            <button type="submit" class="btn btn--primary" style="width:100%">
              <svg class="icon"><use href="#icon-send"></use></svg>
              <span>Envoyer le message</span>
            </button>

            <div class="form-status" id="form-status"></div>
          </form>
        </div>
      </div>
    </section>

    <footer class="page-foot">
      <div class="container">
        <nav class="page-foot__nav">
          <a class="page-foot__link page-foot__link--prev" href="parcours.html">
            <span class="page-foot__link-cue">Précédent</span>
            <span class="page-foot__link-name">Parcours</span>
          </a>
        </nav>
        <div class="page-foot__copyright">© <span data-current-year></span> Elhadj Diattara.</div>
      </div>
    </footer>
  </main>



  <!--Pour mes icônes, j’ai utilisé des SVG, des dessins faits en code. 
  Je les définis une fois en bas de la page, dans une boîte cachée, 
  et chaque bouton les réutilise avec une ligne "use". 
  Elles ne demandent aucun fichier à télécharger et prennent la couleur du texte-->

  <!--viewBox="0 0 24 24" : la grille de dessin, un carré de 24 sur 24.-->
  <!--path d="..." : les consignes de dessin.-->
  <svg style="position:absolute; width:0; height:0; overflow:hidden" aria-hidden="true">
    <defs>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><line x1="5" y1="20" x2="19" y2="20"/></symbol>
      <symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><polyline points="14 3 14 8 19 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="16.5" x2="14" y2="16.5"/></symbol>
      <symbol id="icon-send" viewBox="0 0 24 24"><line x1="21" y1="3" x2="10" y2="14"/><polygon points="21 3 14.5 21 10 14 3 9.5 21 3"/></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><polyline points="5 12 10 17 19 7"/></symbol>
    </defs>
  </svg>

  <script src="js/menu.js" defer></script>
  <script src="js/contact-form.js" defer></script>
</body>
</html>
